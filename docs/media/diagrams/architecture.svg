<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1a202c">
  <title>CardioTwin system architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="335" fill="#ffffff"/>

  <!-- phase labels -->
  <text x="10" y="16" font-size="10.5" font-weight="700" letter-spacing="1" fill="#718096">BUILD TIME · deterministic, outputs committed</text>
  <text x="650" y="16" font-size="10.5" font-weight="700" letter-spacing="1" fill="#718096">RUN TIME</text>
  <line x1="632" y1="24" x2="632" y2="325" stroke="#cbd5e0" stroke-dasharray="4 4"/>

  <!-- inputs -->
  <rect x="10" y="45" width="150" height="80" rx="6" fill="#f7fafc" stroke="#a0aec0"/>
  <text x="85" y="68" text-anchor="middle" font-weight="700">UCI #411 dataset</text>
  <text x="85" y="88" text-anchor="middle">303 patients · 53 inputs</text>
  <text x="85" y="106" text-anchor="middle" fill="#4a5568">SHA-256 pinned</text>

  <rect x="10" y="215" width="150" height="80" rx="6" fill="#f7fafc" stroke="#a0aec0"/>
  <text x="85" y="238" text-anchor="middle" font-weight="700">BodyParts3D</text>
  <text x="85" y="258" text-anchor="middle">STL meshes (FMA ids)</text>
  <text x="85" y="276" text-anchor="middle" fill="#4a5568">SHA-256 pinned</text>

  <!-- pipelines -->
  <rect x="195" y="30" width="235" height="110" rx="6" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="312" y="50" text-anchor="middle" font-weight="700">ml/ · cardiotwin_ml</text>
  <text x="206" y="70" font-size="11.5">leakage guard · locked 20 % test split</text>
  <text x="206" y="87" font-size="11.5">nested repeated CV · 11 candidates</text>
  <text x="206" y="104" font-size="11.5">LR + XGBoost ensemble · Platt · Youden</text>
  <text x="206" y="121" font-size="11.5">exact SHAP · 200-split robustness</text>

  <rect x="195" y="200" width="235" height="110" rx="6" fill="#fffaf0" stroke="#c05621" stroke-width="1.5"/>
  <text x="312" y="220" text-anchor="middle" font-weight="700">anatomy/ · build.py</text>
  <text x="206" y="240" font-size="11.5">synthesise aortic root, veins, fat</text>
  <text x="206" y="257" font-size="11.5">Blender 5.1: clean · smooth · open heart</text>
  <text x="206" y="274" font-size="11.5">territories · SCCT segments · centrelines</text>
  <text x="206" y="291" font-size="11.5">meshopt glTF · 70 reference checks</text>

  <!-- artifacts -->
  <rect x="465" y="45" width="150" height="80" rx="6" fill="#f7fafc" stroke="#a0aec0"/>
  <text x="540" y="66" text-anchor="middle" font-weight="700">ml/artifacts</text>
  <text x="540" y="85" text-anchor="middle">schema · model.json</text>
  <text x="540" y="101" text-anchor="middle">metrics · cohort</text>
  <text x="540" y="117" text-anchor="middle">fixtures · joblib</text>

  <rect x="465" y="215" width="150" height="80" rx="6" fill="#f7fafc" stroke="#a0aec0"/>
  <text x="540" y="238" text-anchor="middle" font-weight="700">public/anatomy</text>
  <text x="540" y="258" text-anchor="middle">GLB · manifest</text>
  <text x="540" y="276" text-anchor="middle">vessels.json</text>

  <!-- runtime -->
  <rect x="660" y="30" width="320" height="60" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/>
  <text x="820" y="53" text-anchor="middle" font-weight="700">FastAPI · native model (joblib)</text>
  <text x="820" y="73" text-anchor="middle">/api/predict · schema · cohort · metrics · docs</text>

  <rect x="650" y="110" width="340" height="215" rx="8" fill="none" stroke="#2f855a" stroke-dasharray="5 4"/>
  <text x="662" y="126" font-size="10.5" font-weight="700" fill="#2f855a">BROWSER · React 18 · React Three Fiber</text>

  <rect x="665" y="137" width="145" height="70" rx="6" fill="#f0fff4" stroke="#2f855a"/>
  <text x="737" y="157" text-anchor="middle" font-weight="700">Edge engine</text>
  <text x="737" y="175" text-anchor="middle">Web Worker</text>
  <text x="737" y="193" text-anchor="middle">evaluates model.json</text>

  <rect x="830" y="137" width="145" height="70" rx="6" fill="#f0fff4" stroke="#2f855a"/>
  <text x="902" y="157" text-anchor="middle" font-weight="700">Workstation UI</text>
  <text x="902" y="175" text-anchor="middle">risk cards · drawers</text>
  <text x="902" y="193" text-anchor="middle">Explain · report</text>

  <rect x="665" y="227" width="310" height="85" rx="6" fill="#f0fff4" stroke="#2f855a"/>
  <text x="820" y="248" text-anchor="middle" font-weight="700">3D stage · one persistent WebGL canvas</text>
  <text x="820" y="267" text-anchor="middle">vessel colour = P(vessel) · territory tint</text>
  <text x="820" y="285" text-anchor="middle">peel · heartbeat · flow · labels · tiers A–D</text>

  <!-- arrows -->
  <g stroke="#4a5568" stroke-width="1.4" fill="none">
    <line x1="160" y1="85" x2="193" y2="85" marker-end="url(#a)"/>
    <line x1="160" y1="255" x2="193" y2="255" marker-end="url(#a)"/>
    <line x1="430" y1="85" x2="463" y2="85" marker-end="url(#a)"/>
    <line x1="430" y1="255" x2="463" y2="255" marker-end="url(#a)"/>
    <path d="M615,62 C640,62 638,58 658,58" marker-end="url(#a)"/>
    <path d="M615,108 C650,108 630,172 663,172" marker-end="url(#a)"/>
    <line x1="615" y1="262" x2="663" y2="262" marker-end="url(#a)"/>
    <line x1="902" y1="92" x2="902" y2="135" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="810" y1="172" x2="828" y2="172" marker-end="url(#a)"/>
    <line x1="902" y1="209" x2="902" y2="225" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <text x="910" y="118" font-size="11" fill="#4a5568">REST</text>
  <text x="737" y="104" text-anchor="middle" font-size="10.5" fill="#4a5568">parity |Δp| ≤ 2.2e-16</text>
</svg>
