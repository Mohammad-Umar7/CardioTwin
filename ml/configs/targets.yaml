# Prediction targets. Adding a target = adding an entry here (plus its column in the dataset).
#
#   id               stable identifier used everywhere (API, UI, metrics)
#   source_column    dataset column holding the label
#   positive_values  raw values counted as the positive class (all others are negative)
#   anatomy          glTF node names the frontend colours with this target's probability
#                    (docs/CONTRACTS.md §2 / §6.2)
#   territory        myocardial territory usually supplied (for tooltips; NOT a lesion map)
#
# Risk is estimated per VESSEL. Nothing in the model localises a lesion inside a vessel.

targets:
  - id: CAD
    label: Coronary artery disease
    short: CAD
    source_column: Cath
    positive_values: [CAD, Cad]
    anatomy: [heart]
    territory: Whole heart - at least one major coronary artery with >= 50 % diameter narrowing
    description: Overall probability that coronary angiography would show at least one major coronary artery (LAD, LCX or RCA) narrowed by 50 % or more.
  - id: LAD
    label: Left anterior descending artery
    short: LAD
    source_column: LAD
    positive_values: [Stenotic]
    anatomy: [Coronary_LAD, Coronary_LAD_Septal]
    territory: Anterior wall, anterior two-thirds of the septum and the apex of the left ventricle
    description: Probability of >= 50 % narrowing somewhere in the left anterior descending artery or its branches.
  - id: LCX
    label: Left circumflex artery
    short: LCX
    source_column: LCX
    positive_values: [Stenotic]
    anatomy: [Coronary_LCX]
    territory: Lateral and posterolateral walls of the left ventricle (and the inferior wall in left-dominant hearts)
    description: Probability of >= 50 % narrowing somewhere in the left circumflex artery or its branches.
  - id: RCA
    label: Right coronary artery
    short: RCA
    source_column: RCA
    positive_values: [Stenotic]
    anatomy: [Coronary_RCA, Coronary_RCA_Marginal, Coronary_RCA_PDA, Coronary_RCA_PL, Coronary_RCA_Septal]
    territory: Right ventricle, inferior wall and inferior septum (via the posterior descending artery in right-dominant hearts), sinus and AV nodes
    description: Probability of >= 50 % narrowing somewhere in the right coronary artery or its branches.

# Columns that encode the angiography result. They are NEVER model inputs (target leakage);
# enforced by preprocess.LEAKAGE_COLUMNS, a runtime assertion and tests/test_leakage.py.
leakage_columns: [LAD, LCX, RCA, Cath]

# Probability risk bands (docs/CONTRACTS.md §0): low < 0.25 <= moderate < 0.50 <= high < 0.75 <= critical
risk_bands:
  - { id: low, label: Low, max: 0.25 }
  - { id: moderate, label: Moderate, max: 0.5 }
  - { id: high, label: High, max: 0.75 }
  - { id: critical, label: Critical, max: 1.0 }
