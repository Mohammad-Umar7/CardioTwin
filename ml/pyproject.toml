[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiotwin-ml"
version = "1.0.0"
description = "CardioTwin prediction pipeline: CAD and vessel-level (LAD/LCX/RCA) stenosis models with exact SHAP explanations and a portable browser model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CardioTwin contributors" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.8,<1.11",
    "xgboost>=3.0,<4",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "shap>=0.46"]

[project.scripts]
cardiotwin-train = "cardiotwin_ml.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:xgboost.*",
]
