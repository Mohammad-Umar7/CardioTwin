<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0E12" />
    <meta
      name="description"
      content="CardioTwin: an explainable coronary digital twin. Predicts overall CAD and LAD, LCX and RCA stenosis risk from routine clinical data, explains every estimate with SHAP and maps it onto real 3D anatomy. Decision support and education only."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>CardioTwin · Explainable coronary risk</title>
    <style>
      /* Paint the app background before CSS loads so first paint is never white. */
      html,
      body {
        background: #0b0e12;
        color: #edf1f5;
      }
      /* Boot screen (LUMEN 2): the brand mark with a beating trace until React's first commit, then it fades. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 480px at 50% 38%, rgba(86, 194, 230, 0.12), transparent 65%),
          radial-gradient(600px 400px at 85% 10%, rgba(129, 140, 248, 0.08), transparent 60%),
          #0b0e12;
        transition:
          opacity 520ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 520ms;
        font-family: 'Inter Tight Variable', 'Inter Variable', system-ui, 'Segoe UI', sans-serif;
      }
      #boot.boot-out {
        opacity: 0;
        visibility: hidden;
      }
      #boot .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #boot .boot-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, rgba(86, 194, 230, 0.18), rgba(129, 140, 248, 0.08));
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.12),
          0 0 48px -8px rgba(86, 194, 230, 0.7);
      }
      #boot .boot-word {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #edf1f5;
      }
      #boot .boot-word span {
        background: linear-gradient(100deg, #9be4f7, #56c2e6 40%, #7aa8ff 75%, #a5b4fc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot .boot-ecg {
        width: 220px;
        height: 36px;
        overflow: visible;
      }
      #boot .boot-ecg path {
        fill: none;
        stroke: #34d399;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        filter: drop-shadow(0 0 4px rgba(52, 211, 153, 0.9));
        animation: boot-sweep 1.4s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      }
      #boot .boot-caption {
        font-family: 'Inter Variable', system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8792a1;
      }
      @keyframes boot-sweep {
        0% {
          stroke-dashoffset: 1;
          opacity: 1;
        }
        70% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-ecg path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
    <script>
      // Start the stage still (V2 §5.18) at top priority for the route being opened, so a cold load never
      // shows an empty hero while the poster decodes. Same size rule as src/three/posters.ts (closest of
      // 1440 / 1280); other routes preload nothing.
      (function () {
        var h = location.hash.replace(/^#/, '') || '/';
        var stage = h === '/' || h.indexOf('/?') === 0 ? 'hero' : h.indexOf('/workstation') === 0 ? 'workstation' : null;
        if (!stage) return;
        var wide = window.innerWidth >= 1360;
        var file = stage === 'hero' ? (wide ? 'hero.webp' : 'hero-1280.webp') : wide ? 'workstation.webp' : 'workstation-1280.webp';
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = './posters/' + file;
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
        <div class="boot-mark">
          <svg viewBox="0 0 32 32" width="34" height="34" fill="none">
            <defs>
              <linearGradient id="boot-g" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#9BE4F7" />
                <stop offset="0.55" stop-color="#56C2E6" />
                <stop offset="1" stop-color="#7AA8FF" />
              </linearGradient>
            </defs>
            <path d="M16 3.5 28.5 16 16 28.5 3.5 16Z" stroke="url(#boot-g)" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M10 16.5h3.4l1.5-3.6 2.6 6.6 1.6-3h3" stroke="#EDF1F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="boot-word">Cardio<span>Twin</span></div>
        <svg class="boot-ecg" viewBox="0 0 220 36">
          <path
            pathLength="1"
            d="M0 22h40l6-4 6 4h18l4 3 6-21 6 27 4-9h22l10-6 10 6h38l6-4 6 4h18l4 3 6-21 6 27 4-9h10"
          />
        </svg>
        <div class="boot-caption">Preparing the twin</div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        CardioTwin needs JavaScript. Decision support and education only; not a diagnosis.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
